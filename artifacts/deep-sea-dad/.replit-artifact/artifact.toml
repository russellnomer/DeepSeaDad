kind = "web"
previewPath = "/"
title = "Deep Sea Dad"
version = "1.0.0"
id = "artifacts/deep-sea-dad"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21993

[services.development]
run = "pnpm --filter @workspace/deep-sea-dad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deep-sea-dad", "run", "build" ]
publicDir = "artifacts/deep-sea-dad/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21993"
BASE_PATH = "/"
